<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano Alimentar</title>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --primary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .time-badge {
      font-size: 0.75rem;
      background-color: var(--card-border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .day-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .day-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .meal-option {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .meal-option:last-child {
      margin-bottom: 0;
    }

    .meal-option.selected {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .meal-option.selected .checkbox {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .meal-option.selected .checkbox::after {
      content: "✓";
      color: #000;
      font-size: 12px;
      font-weight: bold;
    }

    .progress-wrap {
      background-color: var(--card-border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .progress-bar {
      background-color: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
    }

    .sweet-item {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 0.875rem;
    }

    .weekly-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .weekly-day-col {
      text-align: center;
    }

    .weekly-day-name {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .weekly-dot-container {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--card-border);
    }

    .dot.done {
      background-color: var(--accent);
    }
  </style>
</head>

<body>

        ]

    };


    // =====================================================
    // DOCES
    // =====================================================

    const sweetOptions = [
      "Gelatina zero",
      "Iogurte natural + fruta",
      "Banana com canela",
      "Morango + iogurte",
      "Pequena porção de chocolate",
      "Whey + banana",
      "Coca-Cola Zero — 350 ml"
    ];


    // =====================================================
    // ESTADO DA APLICAÇÃO
    // =====================================================

    let currentDay = "segunda";

    let state = JSON.parse(
      localStorage.getItem("denis_diet_state")
    ) || {

      selections: {},

      weeklyProgress: {
        segunda: {},
        terca: {},
        quarta: {},
        quinta: {},
        sexta: {}
      }

    };


    // =====================================================
    // SALVAR
    // =====================================================

    function saveState() {

      localStorage.setItem(
        "denis_diet_state",
        JSON.stringify(state)
      );

    }


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    function init() {

      setupDaySelector();

      renderMeals();

      renderSweets();

      renderWeeklyGrid();

    }


    // =====================================================
    // SELETOR DE DIAS
    // =====================================================

    function setupDaySelector() {

      const buttons =
        document.querySelectorAll(".day-btn");

      buttons.forEach(btn => {

        btn.addEventListener("click", () => {

          buttons.forEach(b =>
            b.classList.remove("active")
          );

          btn.classList.add("active");

          currentDay =
            btn.dataset.day;

          renderMeals();

        });

      });

    }


    // =====================================================
    // RENDERIZAÇÃO DAS REFEIÇÕES
    // =====================================================

    function renderMeals() {

      const container =
        document.getElementById("mealsContainer");

      container.innerHTML = "";

      const mealKeys =
        Object.keys(meals);

      let completedCount = 0;


      mealKeys.forEach(mealKey => {

        const mealData =
          meals[mealKey];

        const optionsList =
          weeklyMeals[currentDay][mealKey];

        const selectedIndex =
          state.weeklyProgress[currentDay]?.[mealKey];


        if (
          selectedIndex !== undefined &&
          selectedIndex !== null
        ) {

          completedCount++;

        }


        const card =
          document.createElement("div");

        card.className = "card";


        let optionsHTML = "";


        optionsList.forEach((opt, idx) => {

          const isSelected =
            selectedIndex === idx;


          optionsHTML += `

            <div
              class="meal-option ${isSelected ? "selected" : ""}"
              onclick="toggleMealOption('${mealKey}', ${idx})"
            >

              <div class="checkbox"></div>

              <div>${opt}</div>

            </div>

          `;

        });


        card.innerHTML = `

          <div class="card-title">

            <span>${mealData.title}</span>

            <span class="time-badge">
              ${mealData.time}
            </span>

          </div>

          <div>
            ${optionsHTML}
          </div>

        `;


        container.appendChild(card);

      });


      // PROGRESSO

      const total =
        mealKeys.length;

      const pct =
        (completedCount / total) * 100;


      document.getElementById(
        "mealProgressBar"
      ).style.width = pct + "%";


      document.getElementById(
        "mealProgressText"
      ).textContent =
        `${completedCount}/${total} refeições concluídas`;

    }


    // =====================================================
    // SELECIONAR REFEIÇÃO
    // =====================================================

    function toggleMealOption(
      mealKey,
      index
    ) {

      if (
        !state.weeklyProgress[currentDay]
      ) {

        state.weeklyProgress[currentDay] = {};

      }


      if (
        state.weeklyProgress[currentDay][mealKey] === index
      ) {

        delete state.weeklyProgress[currentDay][mealKey];

      } else {

        state.weeklyProgress[currentDay][mealKey] =
          index;

      }


      saveState();

      renderMeals();

      renderWeeklyGrid();

    }


    // =====================================================
    // DOCES
    // =====================================================

    function renderSweets() {

      const container =
        document.getElementById(
          "sweetsContainer"
        );


      container.innerHTML =
        sweetOptions.map(
          sweet => `

            <div class="sweet-item">
              🍬 ${sweet}
            </div>

          `
        ).join("");

    }


    // =====================================================
    // RESUMO SEMANAL
    // =====================================================

    function renderWeeklyGrid() {

      const container =
        document.getElementById(
          "weeklyGrid"
        );

      container.innerHTML = "";


      const days = [

        {
          id: "segunda",
          label: "Seg"
        },

        {
          id: "terca",
          label: "Ter"
        },

        {
          id: "quarta",
          label: "Qua"
        },

        {
          id: "quinta",
          label: "Qui"
        },

        {
          id: "sexta",
          label: "Sex"
        }

      ];


      const mealKeys =
        Object.keys(meals);


      days.forEach(d => {

        const dayProgress =
          state.weeklyProgress[d.id] || {};

        let dotsHTML = "";


        mealKeys.forEach(mKey => {

          const isDone =
            dayProgress[mKey] !== undefined &&
            dayProgress[mKey] !== null;


          dotsHTML += `

            <div
              class="dot ${isDone ? "done" : ""}"
            ></div>

          `;

        });


        const col =
          document.createElement("div");

        col.className =
          "weekly-day-col";


        col.innerHTML = `

          <div class="weekly-day-name">
            ${d.label}
          </div>

          <div class="weekly-dot-container">
            ${dotsHTML}
          </div>

        `;


        container.appendChild(col);

      });

    }


    // =====================================================
    // INICIAR APP
    // =====================================================

    init();

  </script>

</body>
</html>
